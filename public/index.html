<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0708">
  <title>Spegeln</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238e1014'/%3E%3Ccircle cx='11' cy='14' r='3' fill='%23000'/%3E%3Ccircle cx='21' cy='14' r='3' fill='%23000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-phase="idle">
  <video id="cam" playsinline muted autoplay></video>

  <main id="booth">
    <header>
      <h1 id="wordmark"></h1>
      <nav>
        <button id="open-gallery" type="button">Galleri</button>
        <button id="mute" type="button" aria-pressed="false">Ljud på</button>
      </nav>
    </header>

    <section class="stage">
      <div id="mirror">
        <canvas id="glass"></canvas>
        <img id="frame" alt="">
        <div id="count" aria-live="polite"></div>
        <div id="status" aria-live="polite"></div>
        <div id="nocam" hidden>
          <p id="nocam-text"></p>
          <label class="upload">Välj bild<input id="upload" type="file" accept="image/*" capture="user"></label>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="setup">
        <div id="themes" role="radiogroup" aria-label="Tema"></div>
        <div id="sliders"></div>
      </div>
      <div class="outcome">
        <p id="caption"></p>
        <p id="note"></p>
      </div>
      <div class="actions">
        <button id="conjure" type="button"></button>
        <div class="after">
          <button id="again" type="button"></button>
          <button id="save" type="button">Spara</button>
        </div>
      </div>
    </section>
  </main>

  <section id="gallery" hidden>
    <header>
      <h2></h2>
      <button class="gallery-close" type="button">Stäng</button>
    </header>
    <p class="gallery-empty" hidden></p>
    <div class="gallery-grid"></div>
    <div class="lightbox" hidden>
      <img alt="">
      <p></p>
      <div class="lightbox-actions">
        <button class="lightbox-close" type="button">Tillbaka</button>
        <button class="lightbox-save" type="button">Spara</button>
        <button class="lightbox-delete" type="button" data-label="Radera" data-confirm="Säker?">Radera</button>
      </div>
    </div>
  </section>

  <div id="threshold">
    <h1 id="title"></h1>
    <p id="tagline"></p>
    <input id="code" type="text" placeholder="Festkod" autocomplete="off" autocapitalize="off" hidden>
    <button id="enter" type="button"></button>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
